
name: Test F3 Aggieland Schedule

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Retrieve weekly Q schedule
        run: python schedule.py
        env:
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}

