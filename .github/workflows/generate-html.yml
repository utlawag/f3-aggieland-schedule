name: Generate Weekly Schedule Image V2

on:
  workflow_dispatch:
    inputs:
      schedule_week:
        description: 'Which week should the image show?'
        required: true
        default: upcoming
        type: choice
        options:
          - upcoming
          - current
  schedule:
    - cron: '15 23 * * 0'

permissions:
  contents: write

jobs:
  generate-html:
    runs-on: ubuntu-24.04
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python and browser dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-color-emoji
          fc-cache -f

      - name: Generate schedule image V2
        run: python generate_html.py
        env:
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          SCHEDULE_WEEK: ${{ inputs.schedule_week || 'upcoming' }}

      - name: Upload PNG
        uses: actions/upload-artifact@v4
        with:
          name: weekly-schedule-v2
          path: weekly_schedule_v2.png
          if-no-files-found: error

      - name: Publish PNG to public repository
        if: ${{ github.event_name == 'schedule' || inputs.schedule_week == 'upcoming' }}
        run: |
          mkdir -p published
          cp weekly_schedule_v2.png published/weekly_schedule.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp weekly_schedule_metadata.json published/weekly_schedule_metadata.json
          git add published/weekly_schedule.png published/weekly_schedule_metadata.json
          if ! git diff --cached --quiet; then
            git commit -m "Update weekly schedule image"
            git push origin HEAD:main
          else
            echo "Published image is already up to date."
          fi
